name: G3 Termux packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

concurrency:
  group: g3-packages-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  dependencies:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Audit dependency licenses and advisories
        run: |
          set -euo pipefail
          evidence=$RUNNER_TEMP/g3-dependencies
          mkdir -p "$evidence"
          rustup toolchain install 1.93.0 --profile minimal
          rustc +1.93.0 --version --verbose >"$evidence/rustc-version.txt"
          cargo +1.93.0 --version --verbose >"$evidence/cargo-version.txt"
          git rev-parse 'HEAD^{commit}' >"$evidence/source-commit.txt"
          cp -- Cargo.toml Cargo.lock "$evidence/"
          (
            cd "$evidence"
            sha256sum Cargo.toml Cargo.lock >source-inputs.sha256
          )
          cargo +1.93.0 install cargo-audit --version 0.22.2 --locked
          cargo +1.93.0 metadata --locked --format-version 1 \
            >"$evidence/cargo-metadata.json"
          jq -r '
            .packages
            | sort_by(.name, .version)[]
            | [.name, .version, (.license // "<missing>"), (.source // "local")]
            | @tsv
          ' "$evidence/cargo-metadata.json" >"$evidence/licenses.tsv"
          jq -e '
            all(.packages[];
              .license == "Apache-2.0" or
              .license == "MIT" or
              .license == "MIT/Apache-2.0" or
              .license == "MIT OR Apache-2.0" or
              .license == "Unlicense OR MIT" or
              .license == "(MIT OR Apache-2.0) AND Unicode-3.0"
            )
          ' "$evidence/cargo-metadata.json" >"$evidence/license-policy.json"
          jq -e '
            all(.packages[];
              (.name == "termux-stacks" and .source == null) or
              ((.source // "")
                | startswith("registry+https://github.com/rust-lang/crates.io-index"))
            )
          ' "$evidence/cargo-metadata.json" >"$evidence/source-policy.json"

          cargo audit --version >"$evidence/cargo-audit-version.txt"
          audit_rc=0
          cargo audit --json >"$evidence/cargo-audit.json" || audit_rc=$?
          git -C "$HOME/.cargo/advisory-db" rev-parse HEAD \
            >"$evidence/rustsec-commit.txt"
          git -C "$HOME/.cargo/advisory-db" remote get-url origin \
            >"$evidence/rustsec-origin.txt"
          printf 'exit_code=%s\n' "$audit_rc" >"$evidence/cargo-audit-exit.txt"
          jq -e '.vulnerabilities.found == false and .vulnerabilities.count == 0' \
            "$evidence/cargo-audit.json" >"$evidence/vulnerability-policy.json"
          jq -e '(.warnings | length) == 0' "$evidence/cargo-audit.json" \
            >"$evidence/warning-policy.json"
          ((audit_rc == 0))

          (
            cd "$evidence"
            find . -type f ! -path ./SHA256SUMS -print0 | sort -z |
              xargs -0 sha256sum >SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload dependency evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: g3-termux-stacks-dependencies-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/g3-dependencies
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  package:
    name: Package (${{ matrix.arch }})
    needs: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, arm, i686, x86_64]
    env:
      BUILD_ARCH: ${{ matrix.arch }}
      TERMUX_PACKAGES_COMMIT: 06d8dfa440d943cde2a2f8b72c3a93f507c1c05c
      TERMUX_BUILDER_IMAGE: ghcr.io/termux/package-builder@sha256:4471cc862c570b15c3a0440668e80b37c9c1750d94fa88a0a4885d959ccf832e
      G3_OLD_PACKAGE_VERSION: 0.0.1-alpha.0-0
      TERMUX_PACKAGES_DIR: ${{ github.workspace }}/termux-packages
      EVIDENCE_DIR: ${{ github.workspace }}/g3-evidence/${{ matrix.arch }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Create immutable source archive
        id: source
        env:
          SOURCE_EVENT: ${{ github.event_name }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_REF_NAME: ${{ github.ref_name }}
          SOURCE_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          [[ $(uname -m) == x86_64 ]]
          [[ -z $(git status --porcelain=v1 --untracked-files=all) ]]

          source_commit=$(git rev-parse 'HEAD^{commit}')
          source_tree=$(git rev-parse 'HEAD^{tree}')
          cargo_version=$(
            awk '
              $0 == "[package]" { in_package = 1; next }
              in_package && /^\[/ { exit }
              in_package && /^version = "[^"]+"$/ {
                sub(/^version = "/, "")
                sub(/"$/, "")
                print
                exit
              }
            ' Cargo.toml
          )
          [[ $cargo_version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?(\+[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]
          debian_version=${cargo_version/-/\~}
          dpkg --validate-version "$debian_version"
          dpkg --compare-versions "$G3_OLD_PACKAGE_VERSION" lt "$debian_version"
          if [[ $cargo_version == *-* ]]; then
            dpkg --compare-versions "$debian_version" lt "${cargo_version%%-*}"
          fi

          tag_type=-
          : >"$RUNNER_TEMP/tag-object.txt"
          if [[ $SOURCE_REF_TYPE == tag ]]; then
            [[ $SOURCE_REF_NAME == "v$cargo_version" ]]
            tag_type=$(git cat-file -t "$SOURCE_REF_NAME")
            [[ $tag_type == tag ]]
            [[ $(git rev-list -n 1 "$SOURCE_REF_NAME") == "$source_commit" ]]
            git cat-file tag "$SOURCE_REF_NAME" >"$RUNNER_TEMP/tag-object.txt"
          elif [[ $SOURCE_EVENT != workflow_dispatch ]]; then
            printf 'Only manual branch builds and version-matching tags are allowed.\n' >&2
            exit 1
          fi

          archive_prefix=termux-stacks-$cargo_version/
          git_archive_name=termux-stacks-$cargo_version.git.tar.gz
          git_archive_path=$RUNNER_TEMP/$git_archive_name
          git archive --format=tar --prefix="$archive_prefix" "$source_commit" |
            gzip -n -9 >"$git_archive_path"

          check_archive() {
            local archive=$1 list=$2 member
            [[ -s $archive && ! -L $archive ]]
            tar -tzf "$archive" >"$list"
            [[ -s $list ]]
            while IFS= read -r member; do
              [[ $member == "$archive_prefix"* ]]
              [[ $member != /* && $member != *'/../'* && $member != *'/./'* ]]
            done <"$list"
            grep -Fxq "${archive_prefix}Cargo.toml" "$list"
            grep -Fxq "${archive_prefix}Cargo.lock" "$list"
            if grep -Eq '(^|/)(\.git|target)(/|$)' "$list"; then
              return 1
            fi
          }
          check_archive "$git_archive_path" "$RUNNER_TEMP/git-archive.list"
          git_archive_sha256=$(sha256sum "$git_archive_path" | awk '{print $1}')

          archive_name=termux-stacks-$cargo_version.tar.gz
          archive_path=$RUNNER_TEMP/$archive_name
          package_source=git-archive
          tag_url=-
          cp -- "$git_archive_path" "$archive_path"
          : >"$RUNNER_TEMP/tag-download.txt"
          : >"$RUNNER_TEMP/tag-tree-diff.txt"
          if [[ $SOURCE_REF_TYPE == tag ]]; then
            package_source=github-tag
            tag_url=https://github.com/frenchfaso/termux-stacks/archive/refs/tags/$SOURCE_REF_NAME.tar.gz
            curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --retry 5 --retry-all-errors --output "$archive_path" \
              --write-out 'effective_url=%{url_effective}\nhttp_code=%{http_code}\n' \
              "$tag_url" >"$RUNNER_TEMP/tag-download.txt"
            grep -Eq '^effective_url=https://codeload\.github\.com/frenchfaso/termux-stacks/' \
              "$RUNNER_TEMP/tag-download.txt"
            grep -Fxq 'http_code=200' "$RUNNER_TEMP/tag-download.txt"
            check_archive "$archive_path" "$RUNNER_TEMP/source-archive.list"

            local_tree=$RUNNER_TEMP/local-tree
            tag_tree=$RUNNER_TEMP/tag-tree
            mkdir "$local_tree" "$tag_tree"
            tar -xzf "$git_archive_path" -C "$local_tree"
            tar -xzf "$archive_path" -C "$tag_tree"
            diff --brief --no-dereference --recursive "$local_tree" "$tag_tree" \
              >"$RUNNER_TEMP/tag-tree-diff.txt"
          else
            cp -- "$RUNNER_TEMP/git-archive.list" "$RUNNER_TEMP/source-archive.list"
          fi

          check_archive "$archive_path" "$RUNNER_TEMP/source-archive.list"
          archive_sha256=$(sha256sum "$archive_path" | awk '{print $1}')
          {
            printf '%s  %s\n' "$archive_sha256" "$archive_name"
            printf '%s  %s\n' "$git_archive_sha256" "$git_archive_name"
          } >"$RUNNER_TEMP/source.SHA256SUMS"
          {
            printf 'event=%s\n' "$SOURCE_EVENT"
            printf 'ref=%s\n' "$SOURCE_REF"
            printf 'commit=%s\n' "$source_commit"
            printf 'tree=%s\n' "$source_tree"
            printf 'cargo_version=%s\n' "$cargo_version"
            printf 'debian_version=%s\n' "$debian_version"
            printf 'package_source=%s\n' "$package_source"
            printf 'tag_type=%s\n' "$tag_type"
            printf 'tag_url=%s\n' "$tag_url"
            printf 'archive=%s\n' "$archive_name"
            printf 'archive_sha256=%s\n' "$archive_sha256"
            printf 'git_archive=%s\n' "$git_archive_name"
            printf 'git_archive_sha256=%s\n' "$git_archive_sha256"
          } >"$RUNNER_TEMP/source-metadata.txt"

          {
            printf 'archive_name=%s\n' "$archive_name"
            printf 'archive_path=%s\n' "$archive_path"
            printf 'archive_sha256=%s\n' "$archive_sha256"
            printf 'git_archive_name=%s\n' "$git_archive_name"
            printf 'git_archive_path=%s\n' "$git_archive_path"
            printf 'git_archive_sha256=%s\n' "$git_archive_sha256"
            printf 'cargo_version=%s\n' "$cargo_version"
            printf 'debian_version=%s\n' "$debian_version"
            printf 'package_source=%s\n' "$package_source"
            printf 'source_commit=%s\n' "$source_commit"
          } >>"$GITHUB_OUTPUT"

      - name: Check out pinned Termux packages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: termux/termux-packages
          ref: 06d8dfa440d943cde2a2f8b72c3a93f507c1c05c
          path: termux-packages
          fetch-depth: 1
          persist-credentials: false

      - name: Stage and lint canonical recipe
        env:
          ARCHIVE_NAME: ${{ steps.source.outputs.archive_name }}
          ARCHIVE_PATH: ${{ steps.source.outputs.archive_path }}
          ARCHIVE_SHA256: ${{ steps.source.outputs.archive_sha256 }}
          GIT_ARCHIVE_NAME: ${{ steps.source.outputs.git_archive_name }}
          GIT_ARCHIVE_PATH: ${{ steps.source.outputs.git_archive_path }}
          GIT_ARCHIVE_SHA256: ${{ steps.source.outputs.git_archive_sha256 }}
          CARGO_VERSION: ${{ steps.source.outputs.cargo_version }}
          DEBIAN_VERSION: ${{ steps.source.outputs.debian_version }}
          PACKAGE_SOURCE: ${{ steps.source.outputs.package_source }}
        run: |
          set -euo pipefail
          [[ $(git -C "$TERMUX_PACKAGES_DIR" rev-parse HEAD) == "$TERMUX_PACKAGES_COMMIT" ]]
          [[ -z $(git -C "$TERMUX_PACKAGES_DIR" status --porcelain=v1 --untracked-files=all) ]]

          mkdir -p "$TERMUX_PACKAGES_DIR/sources"
          mkdir -p "$TERMUX_PACKAGES_DIR/packages/termux-stacks"
          staged_archive=$TERMUX_PACKAGES_DIR/sources/$ARCHIVE_NAME
          recipe=$TERMUX_PACKAGES_DIR/packages/termux-stacks/build.sh
          cp -- "$ARCHIVE_PATH" "$staged_archive"
          [[ $(sha256sum "$staged_archive" | awk '{print $1}') == "$ARCHIVE_SHA256" ]]
          cmp -- "$ARCHIVE_PATH" "$staged_archive"

          # A pre-existing symlink must remain untouched.
          ln -s do-not-follow "$recipe"
          if packaging/termux/materialize-g3-recipe.sh "$staged_archive" "$recipe" \
            >"$RUNNER_TEMP/materializer-symlink.stdout" \
            2>"$RUNNER_TEMP/materializer-symlink.stderr"; then
            printf 'Materializer accepted a pre-existing output symlink.\n' >&2
            exit 1
          fi
          [[ -L $recipe && $(readlink "$recipe") == do-not-follow ]]
          unlink "$recipe"

          # The helper must reject a host-only URL outside the mounted checkout.
          if packaging/termux/materialize-g3-recipe.sh "$ARCHIVE_PATH" "$recipe" \
            >"$RUNNER_TEMP/materializer-negative.stdout" \
            2>"$RUNNER_TEMP/materializer-negative.stderr"; then
            printf 'Materializer accepted an archive outside the Termux checkout.\n' >&2
            exit 1
          fi
          [[ ! -e $recipe && ! -L $recipe ]]

          packaging/termux/materialize-g3-recipe.sh "$staged_archive" "$recipe" |
            tee "$RUNNER_TEMP/recipe-metadata.txt"
          [[ -f $recipe && ! -L $recipe && $(stat -c '%a' "$recipe") == 644 ]]
          bash -n "$recipe"
          grep -Fxq "TERMUX_PKG_VERSION=$DEBIAN_VERSION" "$recipe"
          grep -Fxq 'TERMUX_PKG_SRCURL="file://${TERMUX_SCRIPTDIR}/sources/'"$ARCHIVE_NAME"'"' "$recipe"
          grep -Fxq "TERMUX_PKG_SHA256=$ARCHIVE_SHA256" "$recipe"
          grep -Fxq "cargo_version=$CARGO_VERSION" "$RUNNER_TEMP/recipe-metadata.txt"
          grep -Fxq "debian_version=$DEBIAN_VERSION" "$RUNNER_TEMP/recipe-metadata.txt"

          awk '
            /^TERMUX_PKG_VERSION=/ { print "TERMUX_PKG_VERSION=<materialized>"; next }
            /^TERMUX_PKG_SRCURL=/ { print "TERMUX_PKG_SRCURL=<materialized>"; next }
            /^TERMUX_PKG_SHA256=/ { print "TERMUX_PKG_SHA256=<materialized>"; next }
            { print }
          ' packaging/termux/build.sh.fixture >"$RUNNER_TEMP/fixture.normalized"
          awk '
            /^TERMUX_PKG_VERSION=/ { print "TERMUX_PKG_VERSION=<materialized>"; next }
            /^TERMUX_PKG_SRCURL=/ { print "TERMUX_PKG_SRCURL=<materialized>"; next }
            /^TERMUX_PKG_SHA256=/ { print "TERMUX_PKG_SHA256=<materialized>"; next }
            { print }
          ' "$recipe" >"$RUNNER_TEMP/recipe.normalized"
          cmp -- "$RUNNER_TEMP/fixture.normalized" "$RUNNER_TEMP/recipe.normalized"

          mkdir -p "$EVIDENCE_DIR/source" "$EVIDENCE_DIR/recipe"
          cp -- "$staged_archive" "$EVIDENCE_DIR/source/$ARCHIVE_NAME"
          cp -- "$GIT_ARCHIVE_PATH" "$EVIDENCE_DIR/source/$GIT_ARCHIVE_NAME"
          [[ $(sha256sum "$GIT_ARCHIVE_PATH" | awk '{print $1}') == \
            "$GIT_ARCHIVE_SHA256" ]]
          cp -- "$RUNNER_TEMP/source-metadata.txt" "$EVIDENCE_DIR/source/metadata.txt"
          cp -- "$RUNNER_TEMP/source-archive.list" "$EVIDENCE_DIR/source/archive.list"
          cp -- "$RUNNER_TEMP/git-archive.list" "$EVIDENCE_DIR/source/git-archive.list"
          cp -- "$RUNNER_TEMP/source.SHA256SUMS" "$EVIDENCE_DIR/source/SHA256SUMS"
          cp -- "$RUNNER_TEMP/tag-download.txt" "$EVIDENCE_DIR/source/tag-download.txt"
          cp -- "$RUNNER_TEMP/tag-object.txt" "$EVIDENCE_DIR/source/tag-object.txt"
          cp -- "$RUNNER_TEMP/tag-tree-diff.txt" "$EVIDENCE_DIR/source/tag-tree-diff.txt"
          grep -Fxq "package_source=$PACKAGE_SOURCE" "$EVIDENCE_DIR/source/metadata.txt"
          cp -- "$RUNNER_TEMP/recipe-metadata.txt" "$EVIDENCE_DIR/recipe/metadata.txt"
          cp -- "$RUNNER_TEMP/materializer-negative.stderr" \
            "$EVIDENCE_DIR/recipe/outside-check.stderr"
          cp -- "$RUNNER_TEMP/materializer-symlink.stderr" \
            "$EVIDENCE_DIR/recipe/symlink-check.stderr"
          cp -- "$recipe" "$EVIDENCE_DIR/recipe/build.sh"
          (
            cd "$EVIDENCE_DIR/recipe"
            sha256sum build.sh >build.sh.sha256
          )

          (
            cd "$TERMUX_PACKAGES_DIR"
            ./scripts/lint-packages.sh packages/termux-stacks/build.sh
          ) 2>&1 | tee "$EVIDENCE_DIR/recipe/lint.log"
          [[ $(git -C "$TERMUX_PACKAGES_DIR" rev-parse HEAD) == "$TERMUX_PACKAGES_COMMIT" ]]

      - name: Test rendered Debian removal hook
        run: |
          set -euo pipefail
          test_root=$RUNNER_TEMP/prerm-test
          prefix=$test_root/prefix
          render_dir=$test_root/render
          results=$test_root/results
          service_dir=$prefix/var/service/termux-stacksd
          recipe=$TERMUX_PACKAGES_DIR/packages/termux-stacks/build.sh
          mkdir -p "$prefix/bin" "$service_dir/supervise" "$render_dir" "$results"

          (
            cd "$render_dir"
            TERMUX_PREFIX=$prefix
            TERMUX_PACKAGE_FORMAT=debian
            TERMUX_SCRIPTDIR=$TERMUX_PACKAGES_DIR
            source "$recipe"
            termux_step_create_debscripts
          )
          prerm=$render_dir/prerm
          [[ -x $prerm && ! -L $prerm ]]
          dash -n "$prerm"

          cat >"$prefix/bin/touch" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          [[ $# -eq 1 ]]
          : >>"$1"
          SCRIPT
          cat >"$prefix/bin/sleep" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          printf 'sleep %s\n' "$*" >>"$PRERM_TEST_LOG"
          SCRIPT
          cat >"$prefix/bin/sv" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          [[ ${SVDIR:-} == "$PRERM_TEST_ROOT/prefix/var/service" ]]
          printf 'sv %s\n' "$*" >>"$PRERM_TEST_LOG"
          pid_file=$PRERM_TEST_ROOT/prefix/var/service/termux-stacksd/supervise/pid
          count_file=$PRERM_TEST_ROOT/status-count

          if [[ ${1:-} == -w ]]; then
            [[ $# -eq 4 && $2 == 20 && $3 == down && $4 == termux-stacksd ]]
            case $PRERM_SCENARIO in
              false-negative)
                printf '%s\n' 'timeout: down: termux-stacksd'
                exit 1
                ;;
              inactive)
                printf '%s\n' 'fail: termux-stacksd: runsv not running'
                exit 1
                ;;
              persistent-pid)
                printf '%s\n' 'timeout: down: termux-stacksd'
                exit 1
                ;;
              restarted-pid)
                printf '%s\n' "$PRERM_LIVE_PID" >"$pid_file"
                printf '%s\n' 'ok: down: termux-stacksd'
                exit 0
                ;;
              logger-suffix | rc0-run | want-up)
                printf '%s\n' 'ok: down: termux-stacksd'
                exit 0
                ;;
              *) exit 97 ;;
            esac
          fi

          [[ $# -eq 2 && $1 == status && $2 == termux-stacksd ]]
          count=0
          if [[ -f $count_file ]]; then
            IFS= read -r count <"$count_file"
          fi
          count=$((count + 1))
          printf '%s\n' "$count" >"$count_file"
          case $PRERM_SCENARIO in
            false-negative)
              if [[ $count -eq 1 ]]; then
                printf '%s\n' 'warning: transient supervise status failure'
                exit 1
              fi
              printf '%s\n' 'down: termux-stacksd: 0s; run: log: (pid 4242) 1s'
              ;;
            inactive)
              printf '%s\n' 'fail: termux-stacksd: runsv not running'
              exit 1
              ;;
            logger-suffix | persistent-pid | restarted-pid)
              printf '%s\n' 'down: termux-stacksd: 0s; run: log: (pid 4242) 1s'
              ;;
            rc0-run)
              printf '%s\n' 'run: termux-stacksd: (pid 4243) 0s'
              ;;
            want-up)
              printf '%s\n' 'down: termux-stacksd: 0s, normally up, want up'
              ;;
            *) exit 98 ;;
          esac
          SCRIPT
          chmod 0700 "$prefix/bin/touch" "$prefix/bin/sleep" "$prefix/bin/sv"

          reset_case() {
            local label=$1
            rm -f -- "$service_dir/down" "$test_root/status-count"
            : >"$service_dir/supervise/pid"
            : >"$results/$label.commands"
          }

          run_prerm() {
            local expectation=$1 scenario=$2
            local stdout=$results/$scenario.stdout
            local stderr=$results/$scenario.stderr
            reset_case "$scenario"
            if PRERM_TEST_ROOT=$test_root \
              PRERM_TEST_LOG=$results/$scenario.commands \
              PRERM_SCENARIO=$scenario \
              PRERM_LIVE_PID=$$ \
              dash "$prerm" remove >"$stdout" 2>"$stderr"; then
              [[ $expectation == success ]]
            else
              [[ $expectation == failure ]]
            fi
            [[ -f $service_dir/down && ! -L $service_dir/down ]]
          }

          run_prerm success false-negative
          [[ $(<"$test_root/status-count") == 2 ]]
          grep -Fq 'sv down rc=1: timeout: down: termux-stacksd' \
            "$results/false-negative.stderr"
          grep -Fq 'sv status attempt 1/5 rc=1: warning: transient supervise status failure' \
            "$results/false-negative.stderr"
          grep -Fq 'sv status attempt 2/5 rc=0: down: termux-stacksd: 0s; run: log:' \
            "$results/false-negative.stderr"

          run_prerm success inactive
          [[ $(<"$test_root/status-count") == 1 ]]
          grep -Fq 'sv status attempt 1/5 rc=1: fail: termux-stacksd: runsv not running' \
            "$results/inactive.stderr"

          run_prerm success logger-suffix
          [[ $(<"$test_root/status-count") == 1 ]]

          run_prerm failure rc0-run
          [[ $(<"$test_root/status-count") == 5 ]]
          grep -Fq 'sv down rc=0: ok: down: termux-stacksd' "$results/rc0-run.stderr"
          grep -Fq 'sv status attempt 5/5 rc=0: run: termux-stacksd:' \
            "$results/rc0-run.stderr"
          grep -Fq 'service stop could not be proven after 5 status attempts' \
            "$results/rc0-run.stderr"

          run_prerm failure want-up
          [[ $(<"$test_root/status-count") == 5 ]]
          grep -Fq 'normally up, want up' "$results/want-up.stderr"

          reset_case persistent-pid
          printf '%s\n' "$$" >"$service_dir/supervise/pid"
          if PRERM_TEST_ROOT=$test_root \
            PRERM_TEST_LOG=$results/persistent-pid.commands \
            PRERM_SCENARIO=persistent-pid \
            PRERM_LIVE_PID=$$ \
            dash "$prerm" remove >"$results/persistent-pid.stdout" \
              2>"$results/persistent-pid.stderr"; then
            false
          fi
          [[ $(<"$test_root/status-count") == 5 ]]
          grep -Fq 'service stop could not be proven after 5 status attempts' \
            "$results/persistent-pid.stderr"

          run_prerm failure restarted-pid
          grep -Fq 'supervised daemon PID changed after stop request' \
            "$results/restarted-pid.stderr"

          reset_case upgrade
          PRERM_TEST_ROOT=$test_root \
            PRERM_TEST_LOG=$results/upgrade.commands \
            PRERM_SCENARIO=upgrade \
            PRERM_LIVE_PID=$$ \
            dash "$prerm" upgrade 0.1.0 >"$results/upgrade.stdout" \
              2>"$results/upgrade.stderr"
          [[ ! -e $service_dir/down && ! -L $service_dir/down ]]
          [[ ! -s $results/upgrade.commands ]]

          sha256sum "$prerm" >"$results/prerm.sha256"
          printf '%s\n' \
            'false-negative=PASS' \
            'inactive=PASS' \
            'logger-suffix=PASS' \
            'rc0-run=PASS' \
            'want-up=PASS' \
            'persistent-pid=PASS' \
            'restarted-pid=PASS' \
            'upgrade-inert=PASS' \
            >"$results/summary.txt"
          cp -a -- "$results" "$EVIDENCE_DIR/recipe/prerm-tests"

      - name: Pull pinned builder and build package
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR/builder"
          uname -a >"$EVIDENCE_DIR/builder/runner-uname.txt"
          cp -- /etc/os-release "$EVIDENCE_DIR/builder/runner-os-release.txt"
          docker version >"$EVIDENCE_DIR/builder/docker-version.txt"
          docker pull "$TERMUX_BUILDER_IMAGE" 2>&1 |
            tee "$EVIDENCE_DIR/builder/pull.log"
          docker image inspect "$TERMUX_BUILDER_IMAGE" \
            >"$EVIDENCE_DIR/builder/image.json"
          [[ $(docker image inspect "$TERMUX_BUILDER_IMAGE" --format '{{.Architecture}}') == amd64 ]]
          docker image inspect "$TERMUX_BUILDER_IMAGE" --format '{{range .RepoDigests}}{{println .}}{{end}}' |
            tee "$EVIDENCE_DIR/builder/repo-digests.txt"
          grep -Fxq "$TERMUX_BUILDER_IMAGE" "$EVIDENCE_DIR/builder/repo-digests.txt"
          {
            printf 'termux_packages_commit=%s\n' "$TERMUX_PACKAGES_COMMIT"
            printf 'builder_image=%s\n' "$TERMUX_BUILDER_IMAGE"
            printf 'architecture=%s\n' "$BUILD_ARCH"
            printf 'command=./build-package.sh -a %s -f -r -I termux-stacks\n' "$BUILD_ARCH"
          } >"$EVIDENCE_DIR/builder/build-inputs.txt"

          export TERMUX_BUILDER_IMAGE_NAME=$TERMUX_BUILDER_IMAGE
          export CONTAINER_NAME=termux-package-builder-g3-$BUILD_ARCH
          (
            cd "$TERMUX_PACKAGES_DIR"
            ./scripts/run-docker.sh \
              ./build-package.sh -a "$BUILD_ARCH" -f -r -I termux-stacks
          ) 2>&1 | tee "$EVIDENCE_DIR/builder/build.log"

      - name: Inspect package and ELF
        env:
          DEBIAN_VERSION: ${{ steps.source.outputs.debian_version }}
        run: |
          set -Eeuo pipefail
          status_file=$EVIDENCE_DIR/inspection-status.txt
          inspection_error() {
            local rc=$1 line=$2 command=$3
            trap - ERR
            set +e
            printf 'ERR rc=%s line=%s BASH_COMMAND=%q\n' \
              "$rc" "$line" "$command" >&2
            mkdir -p "$EVIDENCE_DIR"
            {
              printf 'status=failed\n'
              printf 'architecture=%s\n' "$BUILD_ARCH"
              printf 'rc=%s\n' "$rc"
              printf 'line=%s\n' "$line"
              printf 'BASH_COMMAND=%q\n' "$command"
            } >"$status_file"
            exit "$rc"
          }
          trap 'inspection_error "$?" "$LINENO" "$BASH_COMMAND"' ERR
          mkdir -p "$EVIDENCE_DIR"
          printf 'status=incomplete\narchitecture=%s\n' "$BUILD_ARCH" \
            >"$status_file"
          for command_name in dash dpkg-deb file find readelf sha256sum strings; do
            command -v "$command_name" >/dev/null
          done
          # The pinned Termux builder adds revision 0 only when the recipe
          # version still contains a hyphen. Debian pre-releases use a tilde.
          package_version=$DEBIAN_VERSION
          if [[ $package_version == *-* ]]; then
            package_version+=-0
          fi

          mapfile -d '' packages < <(
            find "$TERMUX_PACKAGES_DIR/output" -maxdepth 1 -type f \
              -name 'termux-stacks*' -print0
          )
          [[ ${#packages[@]} -eq 1 ]]
          deb=${packages[0]}
          [[ ${deb##*/} == "termux-stacks_${package_version}_${BUILD_ARCH}.deb" ]]

          package_dir=$EVIDENCE_DIR/package
          control_dir=$package_dir/control
          root_dir=$package_dir/root
          mkdir -p "$control_dir" "$root_dir"
          cp -- "$deb" "$package_dir/${deb##*/}"
          deb=$package_dir/${deb##*/}
          (
            cd "$package_dir"
            sha256sum "${deb##*/}" >SHA256SUMS
          )
          dpkg-deb --info "$deb" >"$package_dir/info.txt"
          dpkg-deb --contents "$deb" >"$package_dir/contents.txt"
          dpkg-deb --control "$deb" "$control_dir"
          dpkg-deb --extract "$deb" "$root_dir"

          [[ $(dpkg-deb --field "$deb" Package) == termux-stacks ]]
          [[ $(dpkg-deb --field "$deb" Version) == "$package_version" ]]
          [[ $(dpkg-deb --field "$deb" Architecture) == "$BUILD_ARCH" ]]
          depends=$(dpkg-deb --field "$deb" Depends)
          [[ $depends == 'libsqlite, proot-distro (= 5.6.0), termux-services' ]]
          deb_size=$(stat -c '%s' "$deb")
          installed_size=$(dpkg-deb --field "$deb" Installed-Size)
          [[ $deb_size =~ ^[0-9]+$ && $deb_size -lt 52428800 ]]
          [[ $installed_size =~ ^[0-9]+$ && $installed_size -lt 51200 ]]
          {
            printf 'deb_bytes=%s\n' "$deb_size"
            printf 'installed_kib=%s\n' "$installed_size"
          } >"$package_dir/sizes.txt"

          [[ -z $(find "$control_dir" -mindepth 1 -maxdepth 1 ! -type f -print -quit) ]]
          find "$control_dir" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' |
            sort >"$package_dir/control-files.txt"
          printf '%s\n' conffiles control postrm prerm \
            >"$RUNNER_TEMP/expected-control-files.txt"
          cmp -- "$RUNNER_TEMP/expected-control-files.txt" "$package_dir/control-files.txt"
          [[ -x $control_dir/prerm && ! -L $control_dir/prerm ]]
          [[ -x $control_dir/postrm && ! -L $control_dir/postrm ]]
          dash -n "$control_dir/prerm" "$control_dir/postrm"
          [[ $(head -n 1 "$control_dir/prerm") == \
            '#!/data/data/com.termux/files/usr/bin/sh' ]]
          [[ $(head -n 1 "$control_dir/postrm") == \
            '#!/data/data/com.termux/files/usr/bin/sh' ]]
          grep -Fq '[ "${1:-}" = remove ]' "$control_dir/prerm"
          grep -Fq '/bin/sv" -w 20 down termux-stacksd' "$control_dir/prerm"
          grep -Fq 'stop_rc=$?' "$control_dir/prerm"
          grep -Fq 'stop_output=$(SVDIR=' "$control_dir/prerm"
          grep -Fq "'fail: termux-stacksd: runsv not running'" "$control_dir/prerm"
          grep -Fq 'elapsed=${elapsed%s}' "$control_dir/prerm"
          grep -Fq 'stop_proven=1' "$control_dir/prerm"
          grep -Fq 'status_attempt_limit=5' "$control_dir/prerm"
          grep -Fq 'sv status attempt %s/%s rc=%s: %s' "$control_dir/prerm"
          grep -Fq 'previous_service_pid=${service_pid}' "$control_dir/prerm"
          grep -Fq 'observed_before_status=${service_pid}' "$control_dir/prerm"
          grep -Fq 'observed_after_status=${service_pid}' "$control_dir/prerm"
          grep -Fq 'observed_final_pid=${service_pid}' "$control_dir/prerm"
          grep -Fq 'kill -0 "${observed_pid}"' "$control_dir/prerm"
          grep -Fq '/bin/touch" "${down_file}" || exit 1' "$control_dir/prerm"
          grep -Fq '/bin/sleep" 1 || exit 1' "$control_dir/prerm"
          grep -Fq '/var/service/termux-stacksd' "$control_dir/prerm"
          if grep -Fq 'rm -rf' "$control_dir/prerm"; then false; fi
          if grep -Eq '/var/(lib|run)/termux-stacks|/var/log/(sv/)?termux-stacksd|/var/lib/proot-distro' \
            "$control_dir/prerm"; then false; fi
          grep -Fq '[ "${1:-}" = purge ]' "$control_dir/postrm"
          grep -Fq 'rm -rf -- "/data/data/com.termux/files/usr/var/service/termux-stacksd"' \
            "$control_dir/postrm"
          [[ $(grep -Ec '^[[:space:]]*rm -rf -- ' "$control_dir/postrm") -eq 1 ]]
          if grep -Eq '/var/(lib|run)/termux-stacks|/var/log/(sv/)?termux-stacksd|/var/lib/proot-distro' \
            "$control_dir/postrm"; then false; fi

          sort "$control_dir/conffiles" >"$RUNNER_TEMP/conffiles.sorted"
          printf '%s\n' \
            /data/data/com.termux/files/usr/var/service/termux-stacksd/down \
            /data/data/com.termux/files/usr/var/service/termux-stacksd/log/down \
            /data/data/com.termux/files/usr/var/service/termux-stacksd/log/run \
            /data/data/com.termux/files/usr/var/service/termux-stacksd/run \
            >"$RUNNER_TEMP/expected-conffiles.txt"
          cmp -- "$RUNNER_TEMP/expected-conffiles.txt" "$RUNNER_TEMP/conffiles.sorted"

          prefix=$root_dir/data/data/com.termux/files/usr
          binary=$prefix/bin/termux-stacks
          [[ -f $binary && -x $binary && ! -L $binary ]]
          [[ -f $prefix/var/service/termux-stacksd/run && \
            -x $prefix/var/service/termux-stacksd/run ]]
          [[ -f $prefix/var/service/termux-stacksd/down && \
            ! -x $prefix/var/service/termux-stacksd/down ]]
          [[ -f $prefix/var/service/termux-stacksd/log/run && \
            -x $prefix/var/service/termux-stacksd/log/run ]]
          [[ ! -s $prefix/var/service/termux-stacksd/down ]]
          grep -Fxq 'exec "$PREFIX/bin/termux-stacks" daemon 2>&1' \
            "$prefix/var/service/termux-stacksd/run"
          grep -Fq '/share/termux-services/svlogger' \
            "$prefix/var/service/termux-stacksd/log/run"
          [[ -L $prefix/share/doc/termux-stacks/copyright ]]
          [[ $(readlink "$prefix/share/doc/termux-stacks/copyright") == \
            ../../LICENSES/Apache-2.0.txt ]]
          [[ ! -e $prefix/var/lib/termux-stacks && ! -L $prefix/var/lib/termux-stacks ]]
          [[ ! -e $prefix/var/run/termux-stacks && ! -L $prefix/var/run/termux-stacks ]]
          [[ -z $(find "$root_dir" -mindepth 1 ! -type d ! -type f ! -type l \
            -print -quit) ]]

          find "$root_dir" -mindepth 1 \( -type f -o -type l \) \
            -printf '%P\t%y\t%m\t%l\n' | sort >"$package_dir/data-files.tsv"
          cut -f1,2 "$package_dir/data-files.tsv" >"$RUNNER_TEMP/data-leaves.tsv"
          printf '%s\n' \
            $'data/data/com.termux/files/usr/bin/termux-stacks\tf' \
            $'data/data/com.termux/files/usr/share/doc/termux-stacks/copyright\tl' \
            $'data/data/com.termux/files/usr/var/service/termux-stacksd/down\tf' \
            $'data/data/com.termux/files/usr/var/service/termux-stacksd/log/run\tf' \
            $'data/data/com.termux/files/usr/var/service/termux-stacksd/run\tf' \
            >"$RUNNER_TEMP/expected-data-leaves.tsv"
          cmp -- "$RUNNER_TEMP/expected-data-leaves.tsv" "$RUNNER_TEMP/data-leaves.tsv"

          elf_dir=$EVIDENCE_DIR/elf
          mkdir -p "$elf_dir"
          cp -- "$binary" "$elf_dir/termux-stacks"
          (
            cd "$elf_dir"
            sha256sum termux-stacks >SHA256SUMS
          )
          file "$binary" >"$elf_dir/file.txt"
          readelf -h "$binary" >"$elf_dir/header.txt"
          readelf -l "$binary" >"$elf_dir/program-headers.txt"
          readelf -d "$binary" >"$elf_dir/dynamic.txt"
          readelf -Ws "$binary" >"$elf_dir/symbols.txt"
          readelf -WS "$binary" >"$elf_dir/sections.txt"
          strings -a "$binary" >"$elf_dir/strings.txt"
          sed -n 's/.*Shared library: \[\([^]]*\)\].*/\1/p' "$elf_dir/dynamic.txt" |
            sort -u >"$elf_dir/needed.txt"
          printf '%s\n' libc.so libdl.so libsqlite3.so >"$RUNNER_TEMP/expected-needed.txt"
          cmp -- "$RUNNER_TEMP/expected-needed.txt" "$elf_dir/needed.txt"

          case $BUILD_ARCH in
            aarch64)
              machine=AArch64
              class=ELF64
              interpreter=/system/bin/linker64
              ;;
            arm)
              machine=ARM
              class=ELF32
              interpreter=/system/bin/linker
              ;;
            i686)
              machine='Intel 80386'
              class=ELF32
              interpreter=/system/bin/linker
              ;;
            x86_64)
              machine='Advanced Micro Devices X86-64'
              class=ELF64
              interpreter=/system/bin/linker64
              ;;
            *) exit 1 ;;
          esac
          grep -Eq "Class:[[:space:]]+$class" "$elf_dir/header.txt"
          grep -Fq "Machine:                           $machine" "$elf_dir/header.txt"
          grep -Eq 'Type:[[:space:]]+DYN' "$elf_dir/header.txt"
          grep -Eq 'Entry point address:[[:space:]]+0x[1-9a-fA-F][0-9a-fA-F]*' \
            "$elf_dir/header.txt"
          grep -Fq "Requesting program interpreter: $interpreter]" \
            "$elf_dir/program-headers.txt"
          grep -Eq '[[:space:]]flock(@[^[:space:]]+)?([[:space:]]+\([0-9]+\))?$' \
            "$elf_dir/symbols.txt"
          grep -Eq '[[:space:]]sqlite3_open_v2(@[^[:space:]]+)?([[:space:]]+\([0-9]+\))?$' \
            "$elf_dir/symbols.txt"
          # termux-elf-cleaner clears unsupported DF_1_PIE, so file(1) may
          # classify this Android PIE as a shared object. Executable mode,
          # ET_DYN, a nonzero entry point, and exact PT_INTERP prove the shape.
          if grep -q 'not stripped' "$elf_dir/file.txt"; then false; fi
          grep -Eq '(^|, )stripped$' "$elf_dir/file.txt"
          if grep -Eq '\(RPATH\)' "$elf_dir/dynamic.txt"; then false; fi
          [[ $(grep -Ec '\(RUNPATH\)' "$elf_dir/dynamic.txt") -eq 1 ]]
          runpath=$(sed -n \
            's/.*(RUNPATH).*Library runpath: \[\([^]]*\)\].*/\1/p' \
            "$elf_dir/dynamic.txt")
          [[ $runpath == /data/data/com.termux/files/usr/lib ]]
          printf '%s\n' "$runpath" >"$elf_dir/runpath.txt"
          if grep -Eq '\.debug_(info|line|str|abbrev)' "$elf_dir/sections.txt"; then false; fi
          if grep -Eq '[[:space:]]\.symtab([[:space:]]|$)' "$elf_dir/sections.txt"; then false; fi
          grep -E 'TERMUX_STACKS_(FAULT_DIR|SQLITE_MAX_PAGES|TEST_IMMEDIATE_RESTART|TEST_DAEMON_STARTUP_PAUSE_DIR)' \
            "$elf_dir/strings.txt" >"$elf_dir/fault-hooks.txt" || true
          [[ ! -s $elf_dir/fault-hooks.txt ]]

          rm -rf -- "$root_dir"
          printf 'status=accepted\narchitecture=%s\n' "$BUILD_ARCH" \
            >"$status_file"
          (
            cd "$EVIDENCE_DIR"
            find . -type f ! -path ./SHA256SUMS -print0 | sort -z |
              xargs -0 sha256sum
          ) >"$RUNNER_TEMP/evidence.SHA256SUMS"
          mv -- "$RUNNER_TEMP/evidence.SHA256SUMS" "$EVIDENCE_DIR/SHA256SUMS"
          (
            cd "$EVIDENCE_DIR"
            sha256sum -c SHA256SUMS
          )

      - name: Upload package evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: g3-termux-stacks-${{ matrix.arch }}-${{ job.status }}-attempt-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
