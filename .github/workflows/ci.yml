name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate device harness syntax
        run: |
          bash -n packaging/termux/build.sh.fixture
          bash -n tests/device/lib.sh tests/device/s0.sh tests/device/s1.sh tests/device/s2.sh tests/device/s3.sh tests/device/s4.sh tests/device/s5.sh tests/device/g2.sh
          dash -n tests/device/fixtures/s1/probe tests/device/fixtures/s2/worker tests/device/fixtures/s3/worker tests/device/fixtures/g2/worker
          bash -n tests/device/fixtures/s2/verify-oci.sh tests/device/fixtures/s3/verify-oci.sh tests/device/fixtures/s4/verify-oci.sh tests/device/fixtures/s5/verify-oci.sh tests/device/fixtures/g2/verify-oci.sh
          python3 -m py_compile tests/device/fixtures/s4/slow_http.py tests/device/fixtures/s5/protocol_probe.py

      - name: Install Rust 1.93
        run: rustup toolchain install 1.93.0 --profile minimal --component clippy,rustfmt

      - name: Check formatting
        run: cargo +1.93.0 fmt --all -- --check

      - name: Lint
        run: cargo +1.93.0 clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo +1.93.0 test --locked

      - name: Build release binary
        run: cargo +1.93.0 build --release --locked
