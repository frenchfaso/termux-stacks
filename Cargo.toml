[package]
name = "termux-stacks"
version = "0.0.1-alpha.0"
edition = "2024"
rust-version = "1.93"
publish = false
description = "Declarative service stacks for Termux using PRoot"
license = "Apache-2.0"
repository = "https://github.com/frenchfaso/termux-stacks"
homepage = "https://github.com/frenchfaso/termux-stacks"
readme = "README.md"

[dependencies]
libc = { version = "0.2.189", default-features = false }
rusqlite = { version = "0.40.2", default-features = false }
saphyr-parser = { version = "0.0.11", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4.4"

[[bin]]
name = "termux-stacks"
path = "src/main.rs"
